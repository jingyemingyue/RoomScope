# Unsigned desktop bundles and a draft GitHub Release on a maintainer-pushed v* tag.
# Numbered Releases stay a maintainer decision: this workflow only opens a draft.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,gui]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest
        env:
          QT_QPA_PLATFORM: offscreen

  package:
    name: sdist and wheel
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  bundle:
    name: Unsigned bundle (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 libegl1 libgl1
      - name: Install
        run: pip install -e ".[dev,gui]" pyinstaller
      - name: License bundle
        run: python scripts/build_license_bundle.py --out THIRD_PARTY_LICENSES
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/roomscope.spec
      - name: Copy licenses into the bundle
        shell: bash
        run: cp -R THIRD_PARTY_LICENSES dist/roomscope/THIRD_PARTY_LICENSES
      - name: Strip ASIO DLLs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: find dist/roomscope -iname '*asio*.dll' -delete
      - name: Bundle contents gate
        run: python scripts/check_bundle_contents.py --root dist/roomscope --require-licenses
      - name: Smoke test
        shell: bash
        run: |
          if [ -x dist/roomscope/roomscope ]; then
            dist/roomscope/roomscope --version
            dist/roomscope/roomscope --backend fake devices
          elif [ -x dist/roomscope/roomscope.exe ]; then
            dist/roomscope/roomscope.exe --version
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          path: dist/roomscope

  draft-release:
    name: Draft GitHub Release (maintainer publishes)
    needs: [package, bundle]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
          body: |
            Unsigned desktop bundles. See docs/user-guide/en.md for Gatekeeper / SmartScreen steps.
            The maintainer publishes this draft; creating a numbered Release is a maintainer decision.
