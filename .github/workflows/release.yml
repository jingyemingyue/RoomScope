# Unsigned desktop bundles and a draft GitHub Release on a maintainer-pushed v* tag.
# Numbered Releases stay a maintainer decision: this workflow only opens a draft.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,gui]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: pytest
        env:
          QT_QPA_PLATFORM: offscreen

  package:
    name: sdist and wheel
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist/*

  bundle:
    name: Unsigned bundle (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 libegl1 libgl1
      - name: Install
        run: pip install -e ".[dev,gui]" pyinstaller
      - name: License bundle
        run: python scripts/build_license_bundle.py --out THIRD_PARTY_LICENSES
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/roomscope.spec
      - name: Copy licenses into the bundle
        shell: bash
        run: cp -R THIRD_PARTY_LICENSES dist/roomscope/THIRD_PARTY_LICENSES
      - name: Strip ASIO DLLs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: find dist/roomscope -iname '*asio*.dll' -delete
      - name: Strip GPL-named Qt plugins Essentials still ships
        shell: bash
        run: |
          find dist/roomscope dist/RoomScope.app \
            \( -iname '*qtvirtualkeyboard*' -o -iname '*qtquicktimeline*' \
               -o -iname '*qtcharts*' -o -iname '*qtdatavisualization*' \
               -o -iname '*qtgraphs*' -o -iname '*qtlottie*' \
               -o -iname '*qtquick3d*' -o -iname '*qthttpserver*' \
               -o -iname '*qtnetworkauth*' -o -iname '*qtshadertools*' \) \
            -delete 2>/dev/null || true
      - name: Bundle contents gate
        run: python scripts/check_bundle_contents.py --root dist/roomscope --require-licenses
      - name: Smoke test
        shell: bash
        run: |
          python scripts/smoke_bundle.py --root dist/roomscope --out "$RUNNER_TEMP/bundle-smoke"
      - name: Windows zip
        if: runner.os == 'Windows'
        shell: bash
        run: python -c "import shutil; shutil.make_archive('dist/roomscope-windows-x64', 'zip', 'dist/roomscope')"
      - name: Windows Inno Setup (when ISCC is installed)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if command -v iscc >/dev/null 2>&1; then
            iscc packaging/windows/roomscope.iss
          else
            echo "ISCC not on PATH; installer script is packaging/windows/roomscope.iss"
          fi
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: bash packaging/macos/make_dmg.sh dist/RoomScope.app dist/RoomScope.dmg
      - name: Linux archive
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/roomscope-linux-x86_64.tar.gz roomscope
      - name: Checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          app = Path("dist/RoomScope.app")
          root = app if app.exists() else Path("dist/roomscope")
          lines = []
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.as_posix()}")
          Path("dist/SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            dist/roomscope
            dist/RoomScope.app
            dist/RoomScope.dmg
            dist/roomscope-windows-x64.zip
            dist/roomscope-linux-x86_64.tar.gz
            dist/RoomScope-setup.exe
            dist/SHA256SUMS

  sbom:
    name: CycloneDX SBOM
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[gui]" cyclonedx-bom
      - run: python scripts/compile_bundle_lock.py
      - name: SBOM
        run: |
          python -m cyclonedx_py environment -o cyclonedx.sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: |
            cyclonedx.sbom.json
            requirements/bundle.lock

  pypi:
    name: Publish to PyPI (trusted publishing)
    needs: [package, quality]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
          verbose: true

  draft-release:
    name: Draft GitHub Release (maintainer publishes)
    needs: [package, bundle, sbom]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
          body: |
            Unsigned desktop bundles. See docs/user-guide/en.md for Gatekeeper / SmartScreen steps.
            The maintainer publishes this draft; creating a numbered Release is a maintainer decision.
