# Build unsigned bundles and prepare a draft Release for the version on main.
# A pull request that changes this workflow runs the same package gates without
# creating a Release, tag, or PyPI upload.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - pyproject.toml
      - .github/workflows/release.yml
      - packaging/**
      - scripts/smoke_bundle.py
      - src/roomscope/__main__.py
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - scripts/check_bundle_contents.py
      - scripts/check_macos_dmg.py
      - scripts/smoke_bundle.py
      - src/roomscope/__main__.py
      - tests/unit/test_desktop_entry.py
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate version and release intent
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      draft: ${{ steps.version.outputs.draft }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - id: version
        name: Check version, tag and existing Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "draft=false" >> "$GITHUB_OUTPUT"
          if [[ "$REF_TYPE" == tag ]]; then
            if [[ "$REF_NAME" != "v$version" ]]; then
              echo "Tag $REF_NAME does not match pyproject.toml ($version)" >&2
              exit 1
            fi
          fi
          if [[ "$version" == *dev* ]]; then
            echo "Development version: no draft or PyPI upload."
            exit 0
          fi
          if [[ "$REF_TYPE" == branch && "$REF_NAME" == main ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "v$version already has a tag: no new draft."
              exit 0
            fi
            echo "draft=true" >> "$GITHUB_OUTPUT"
          elif [[ "$REF_TYPE" == tag ]]; then
            if gh release view "v$version" --json isDraft --jq '.isDraft' 2>/dev/null | grep -qx false; then
              echo "v$version is already published: do not turn it back into a draft."
            else
              echo "draft=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  quality:
    name: Lint and test
    needs: prepare
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0
      - run: pip install -e ".[dev,gui]"
      - run: ruff check . && ruff format --check .
      - run: mypy
      - run: python scripts/check_doc_links.py && python scripts/check_src_safety.py
      - run: python scripts/build_docs_site.py --out "$RUNNER_TEMP/roomscope-site"
      - run: pytest --cov=roomscope.core --cov=roomscope.models --cov-fail-under=85
      - run: pytest tests/unit/test_schemas.py tests/unit/test_public_api.py

  package:
    name: sdist and wheel
    needs: [prepare, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build && python -m build
      - run: pip install dist/*.whl && roomscope --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  bundle:
    name: Unsigned bundle (${{ matrix.os }})
    needs: [prepare, quality]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/bundle.lock
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0
      - name: Install pinned runtime and build tools
        run: |
          pip install -r requirements/bundle.lock
          pip install -e ".[dev,gui]" pyinstaller==6.22.3
          pip check
      - name: License bundle
        run: python scripts/build_license_bundle.py --out THIRD_PARTY_LICENSES
      - name: PyInstaller
        run: pyinstaller --noconfirm --clean packaging/roomscope.spec
      - name: Copy licenses and remove disallowed modules
        shell: bash
        run: |
          cp -R THIRD_PARTY_LICENSES dist/roomscope/THIRD_PARTY_LICENSES
          python scripts/check_bundle_contents.py --root dist/roomscope --strip --require-licenses
      - name: Check macOS .app and its licenses
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p dist/RoomScope.app/Contents/Resources
          cp -R THIRD_PARTY_LICENSES dist/RoomScope.app/Contents/Resources/THIRD_PARTY_LICENSES
          python scripts/check_bundle_contents.py --root dist/RoomScope.app --strip
          python scripts/check_bundle_contents.py --root dist/RoomScope.app/Contents/Resources --require-licenses
          codesign --force --deep --sign - dist/RoomScope.app
          codesign --verify --deep --strict --verbose=2 dist/RoomScope.app
      - name: Smoke frozen binary
        shell: bash
        run: |
          launcher=--require-gui-launcher
          [[ "$RUNNER_OS" != macOS ]] || launcher=
          python scripts/smoke_bundle.py --root dist/roomscope --out "$RUNNER_TEMP/bundle-smoke" $launcher
      - name: Smoke macOS .app executable
        if: runner.os == 'macOS'
        shell: bash
        run: QT_QPA_PLATFORM=offscreen dist/RoomScope.app/Contents/MacOS/RoomScope gui --smoke
      - name: Windows zip
        if: runner.os == 'Windows'
        shell: bash
        run: python -c "import shutil; shutil.make_archive('dist/roomscope-windows-x64', 'zip', 'dist/roomscope')"
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ROOMSCOPE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          & $iscc "/DMyAppVersion=$env:ROOMSCOPE_VERSION" packaging\windows\roomscope.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed ($LASTEXITCODE)" }
          if (-not (Test-Path dist\RoomScope-setup.exe)) { throw 'dist\RoomScope-setup.exe missing' }
      - name: Install, smoke and uninstall the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'RoomScope-installed'
          $p = Start-Process dist\RoomScope-setup.exe -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir")
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $dir 'roomscope-gui.exe'))) { throw 'roomscope-gui.exe not installed' }
          if (-not (Test-Path (Join-Path $dir 'THIRD_PARTY_LICENSES'))) { throw 'licenses not installed' }
          python scripts/smoke_bundle.py --root $dir --out (Join-Path $env:RUNNER_TEMP 'installed-smoke') --require-gui-launcher
          if ($LASTEXITCODE -ne 0) { throw 'installed smoke failed' }
          $u = Start-Process (Join-Path $dir 'unins000.exe') -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
          if ($u.ExitCode -ne 0) { throw "uninstaller exited with $($u.ExitCode)" }
          # The uninstaller re-launches itself from %TEMP%; wait for it to finish.
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir 'roomscope.exe')); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $dir 'roomscope.exe')) { throw 'uninstall left roomscope.exe behind' }
      - name: macOS disk image
        if: runner.os == 'macOS'
        run: |
          bash packaging/macos/make_dmg.sh dist/RoomScope.app dist/RoomScope.dmg
          python scripts/check_macos_dmg.py dist/RoomScope.dmg
      - name: Linux archive
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/roomscope-linux-x86_64.tar.gz roomscope
      - name: Checksums of distributable files
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          names = ['roomscope-linux-x86_64.tar.gz', 'RoomScope.dmg',
                   'roomscope-windows-x64.zip', 'RoomScope-setup.exe']
          assets = [Path('dist') / name for name in names if (Path('dist') / name).is_file()]
          if not assets:
              raise SystemExit('No distributable archive found')
          lines = [f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}'
                   for path in assets]
          (Path('dist') / f'SHA256SUMS-{os.environ["RUNNER_OS"]}').write_text(
              '\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.os }}
          path: |
            dist/roomscope-linux-x86_64.tar.gz
            dist/RoomScope.dmg
            dist/roomscope-windows-x64.zip
            dist/RoomScope-setup.exe
            dist/SHA256SUMS-*
          if-no-files-found: error

  sbom:
    name: CycloneDX SBOM
    needs: [prepare, quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/bundle.lock
      - run: pip install -r requirements/bundle.lock && pip install -e ".[gui]" cyclonedx-bom
      - run: python scripts/compile_bundle_lock.py --out generated-bundle.lock
      - run: python -m cyclonedx_py environment -o cyclonedx.sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: |
            cyclonedx.sbom.json
            generated-bundle.lock
          if-no-files-found: error

  draft-release:
    name: Draft GitHub Release (maintainer publishes)
    needs: [prepare, quality, package, bundle, sbom]
    if: needs.prepare.outputs.draft == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Extract version notes
        env:
          ROOMSCOPE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          version = re.escape(os.environ['ROOMSCOPE_VERSION'])
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(r'(?ms)^## \[' + version + r'\].*?\n(.*?)(?=^## \[|\Z)', changelog)
          if match is None:
              raise SystemExit('CHANGELOG section missing for this version')
          header = Path('packaging/release-notes-header.md').read_text(encoding='utf-8')
          header = header.replace('{version}', os.environ['ROOMSCOPE_VERSION'])
          Path('release-notes.md').write_text(header + '## Changes\n\n'
              + match.group(1).strip() + '\n', encoding='utf-8')
          PY
      - name: Restore matching draft tag name if GitHub reset it
        env:
          GH_TOKEN: ${{ github.token }}
          ROOMSCOPE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          release_ids="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.draft and .name == \"v$ROOMSCOPE_VERSION\") | .id")"
          if [[ -n "$release_ids" ]]; then
            [[ "$release_ids" != *$'\n'* ]] || { echo 'Multiple matching drafts' >&2; exit 1; }
            release="repos/$GITHUB_REPOSITORY/releases/$release_ids"
            tag="$(gh api "$release" --jq '.tag_name')"
            if [[ "$tag" == untagged-* ]]; then
              gh api --method PATCH "$release" -f tag_name="v$ROOMSCOPE_VERSION" \
                -f target_commitish="$GITHUB_SHA" >/dev/null
              test "$(gh api "$release" --jq '.tag_name')" = "v$ROOMSCOPE_VERSION"
            else
              test "$tag" = "v$ROOMSCOPE_VERSION"
            fi
          fi
      - name: Open or update draft
        id: release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.prepare.outputs.version }}
          draft: true
          prerelease: true
          body_path: release-notes.md
          files: artifacts/**/*
          fail_on_unmatched_files: true
      - name: Point draft at tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
          ROOMSCOPE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -n "$RELEASE_ID"
          release="repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
          test "$(gh api "$release" --jq '.draft')" = true
          gh api --method PATCH "$release" -f tag_name="v$ROOMSCOPE_VERSION" \
            -f target_commitish="$GITHUB_SHA" >/dev/null
          test "$(gh api "$release" --jq '.target_commitish')" = "$GITHUB_SHA"
          test "$(gh api "$release" --jq '.tag_name')" = "v$ROOMSCOPE_VERSION"
          test "$(gh api "$release" --jq '.draft')" = true

  pypi:
    name: Publish to PyPI (explicit opt-in)
    needs: [prepare, quality, package, bundle, sbom]
    if: startsWith(github.ref, 'refs/tags/v') && vars.ROOMSCOPE_PUBLISH_PYPI == 'true' && !contains(needs.prepare.outputs.version, 'dev')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true
          verbose: true
