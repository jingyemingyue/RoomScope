# Continuous integration for RoomScope.
# DSP correctness is the product: a green run means the synthetic suite, the
# linters and the type checker all passed on this revision.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy
      - name: No-network imports under src/
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          banned = {"socket", "urllib", "http", "requests", "ssl"}
          root = pathlib.Path("src")
          bad = []
          for path in root.rglob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.module:
                      names = [node.module.split(".")[0]]
                  else:
                      continue
                  hits = [n for n in names if n in banned]
                  if hits:
                      bad.append(f"{path}: {hits}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("no banned network imports")
          PY

  schemas:
    name: JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Schema tests
        run: pytest tests/unit/test_schemas.py tests/unit/test_public_api.py
      - name: roomscope schema matches shipped files
        run: |
          for name in result session comparison project sidecar; do
            python -c "from roomscope.schemas import schema_text, SCHEMA_FILES; from importlib.resources import files; import sys; data=schema_text('$name'); shipped=files('roomscope.schemas').joinpath(SCHEMA_FILES['$name']).read_text(encoding='utf-8'); sys.exit(0 if data==shipped else 1)"
            roomscope schema "$name" > /tmp/schema.out
            python -c "from roomscope.schemas import schema_text; import pathlib, sys; sys.exit(0 if pathlib.Path('/tmp/schema.out').read_text(encoding='utf-8')==schema_text('$name') else 1)"
          done

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries (PortAudio + Qt offscreen)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xfixes0
      - name: Install
        run: pip install -e ".[dev,gui]"
      - name: Pytest
        run: pytest
      - name: Standalone flow on the fake backend
        shell: bash
        run: |
          roomscope --backend fake devices
          roomscope --backend fake measure --out "$RUNNER_TEMP/standalone" \
            --duration 2 --post-silence 1.5 --level -20
      - name: Example script
        shell: bash
        run: python examples/synthetic_measurement.py "$RUNNER_TEMP/synthetic"

  package:
    name: sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build
        run: |
          pip install build
          python -m build
          pip install dist/*.whl
          python -c "import roomscope; print(roomscope.__version__)"
          roomscope --help

  bundle-gates:
    name: License bundle and GPL-module gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,gui]"
      - name: Build license bundle
        run: python scripts/build_license_bundle.py --out /tmp/THIRD_PARTY_LICENSES
      - name: Gate installed PySide6 Essentials
        run: |
          python - <<'PY'
          import PySide6, pathlib
          from pathlib import Path
          import subprocess, sys
          root = pathlib.Path(PySide6.__file__).parent
          raise SystemExit(subprocess.call([sys.executable, "scripts/check_bundle_contents.py", "--root", str(root)]))
          PY
